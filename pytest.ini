[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Isolated unit, math, schema, and validation tests (zero disk dataset dependencies)
    environment: Environment, configuration, health probes, and database connection tests
    data_dependent: Real data integration and API tests requiring official competition assets
    data_integrity: Cryptographic SHA-256 provenance and file-existence verification tests
