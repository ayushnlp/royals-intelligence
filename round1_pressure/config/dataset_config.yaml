  reconstruction_audit_parquet: "round1_pressure/data/processed/reconstruction_audit.parquet"
  match_state_report_md: "round1_pressure/reports/match_state_reconstruction_report.md"

expected_files:
  ball_by_ball: "ball_by_ball.csv"
  matches: "matches.csv"
  competitions: "competitions.csv"
  teams: "teams.csv"
  playing_eleven: "playing_eleven.csv"
  competition_team_player_mapping: "competition_team_player_mapping.csv"

schemas:
  competitions:
    primary_key: ["comp_id"]
    required_columns:
      - comp_id
      - comp_name
      - match_format
      - season

  teams:
    primary_key: ["comp_id", "team_id"]
    required_columns:
      - comp_id
      - team_id
      - team_name

  matches:
    primary_key: ["match_id"]
    foreign_keys:
      comp_id: "competitions.comp_id"
      home_team_id: "teams.team_id"
      away_team_id: "teams.team_id"
    required_columns:
      - match_id
      - comp_id
      - match_number
      - match_date
      - stage
      - venue_id
      - venue_country
      - home_team_id
      - home_team
      - away_team_id
      - away_team
      - home_team_captain_id
      - away_team_captain_id
      - toss_win_team_id
      - toss_opted
      - man_of_the_match
      - first_inn_revised_overs
      - second_inn_revised_overs
      - revised_target
      - knock_out
      - win_team_id
      - result

  playing_eleven:
    primary_key: ["match_id", "player_id"]
    foreign_keys:
      match_id: "matches.match_id"
      team_id: "teams.team_id"
    required_columns:
      - match_id
      - team_id
      - player_id
      - batting_order
      - is_played
      - is_captain
      - is_wk
      - is_impact
      - is_impact_off

  competition_team_player_mapping:
    primary_key: ["comp_id", "team_id", "player_id"]
    foreign_keys:
      comp_id: "competitions.comp_id"
      team_id: "teams.team_id"
    required_columns:
      - comp_id
      - comp_name
      - team_id
      - team_name
      - player_id
      - player_name

  ball_by_ball:
    primary_key: ["match_id", "innings", "overid", "over_ball_num"]
    foreign_keys:
      match_id: "matches.match_id"
      batting_team_id: "teams.team_id"
      bowling_team_id: "teams.team_id"
      striker_id: "competition_team_player_mapping.player_id"
      bowler_id: "competition_team_player_mapping.player_id"
    required_columns:
      - match_id
      - innings
      - overid
      - over_ball_num
      - innings_ball_num
      - batting_team_id
      - bowling_team_id
      - striker_id
      - striker_name
      - non_striker_id
      - non_striker_name
      - bowler_id
      - bowler_name
      - batting_type
      - bowling_type
      - batting_order
      - runs
      - is_four
      - is_six
      - is_wicket
      - dismissal_type_id
      - dismissal_type
      - dismissed_player_id
      - extras_type
      - extras1_runs
      - extras_2_runs
      - pace_or_spin
      - bowl_speed
      - stroke
      - delivery_style
      - over_or_around
      - on_or_off
      - delivery_ist_time

# Cricket Domain Interpretation Rules (R1-01.1 Updated)
cricket_rules:
  # extras1_runs is a categorical mapping of extras_type, NOT run values!
  extras_code_mapping:
    1: "Overstep"
    2: "wide"
    3: "legbyes"
    4: "byes"
    5: "other"
    6: "NONE"
    7: "Penalty"

  # Evidence-Based Delivery Legality Classification:
  # Confirmed Legal: Standard deliveries (189,167), legbyes (2,748), byes (529), Penalty (1) = 192,445
  # Confirmed Illegal: wide (7,714), Overstep (576) = 8,290
  # Ambiguous / Unresolved: other (264)
  delivery_legality:
    confirmed_legal_extras:
      - "legbyes"
      - "byes"
      - "Penalty"
    confirmed_illegal_extras:
      - "wide"
      - "Overstep"
    ambiguous_extras:
      - "other"

  # Delivery Count Benchmarks:
  delivery_counts:
    total_deliveries: 200999
    confirmed_legal: 192445
    confirmed_illegal: 8290
    ambiguous_unresolved: 264
    strict_legal_total: 192445
    permissive_legal_total: 192709

  # Bowler wicket attribution
  bowler_credited_dismissals:
    - "Bowled"
    - "Caught"
    - "LBW"
    - "Stump"
    - "Hit Wicket"

  non_bowler_dismissals:
    - "RunOut"
    - "Retire Out"
    - "Obstracting the field"
    - "Obstructing the field"

  # Dismissal spelling normalization
  dismissal_spelling_corrections:
    "Obstracting the field": "Obstructing the field"

  # Competition classification filters
  competition_categories:
    ipl:
      patterns: ["IPL", "Indian Premier League"]
      tier: "Tier-1 Franchise League"
    t20i:
      patterns: ["T20I", "Twenty20 International", "T20 International"]
      tier: "Senior International"
    emerging:
      patterns: ["Emerging", "Rising Stars"]
      tier: "Feeder / A-Team Tournament"

# Task R1-02: Match-State Reconstruction Governance
match_state_reconstruction:
  scenarios:
    strict:
      legal_rule: "extras_type not in ['wide', 'Overstep', 'other']"
      other_treatment: "AMBIGUOUS_UNRESOLVED_EXCLUDED"
      expected_legal_deliveries: 192445
    permissive:
      legal_rule: "extras_type not in ['wide', 'Overstep']"
      other_treatment: "AMBIGUOUS_FLAGGED_LEGAL"
      expected_legal_deliveries: 192709

  scope_filters:
    excluded_comp_ids: [2670, 3289] # Emerging Teams Asia Cup 2024, Rising Stars 2025
    excluded_innings: [3, 4]        # Super Overs
    primary_scope_expected_deliveries: 193988

  score_completeness:
    unconfirmed_extras_types: ["byes", "legbyes", "Penalty"]
    fallback_policy: "RETAIN_VALID_PARTIAL_METRICS_FLAG_SCORE_INCOMPLETE"
    exact_innings_expected: 329
    lower_bound_innings_expected: 1395

# Task R1-02.1: Match-State Integrity Audit & Remediation Governance
match_state_audit_r1_02_1:
  score_disentanglement:
    exact_status: "EXACT"
    lower_bound_status: "LOWER_BOUND_ONLY"
    chase_withholding_rule: "runs_required_exact and required_run_rate_exact MUST be null when score is LOWER_BOUND_ONLY"
    bounds_preservation: "cumulative_team_runs_lower_bound and runs_required_upper_bound remain valid"

  extras_2_runs_governance:
    classification: "EMPIRICAL_INFERENCE"
    non_zero_count: 36
    total_deliveries: 200999
    percentage: 0.018
    uncertainty_policy: "DOCUMENTED_EMPIRICAL_INFERENCE_RETAIN_UNCERTAINTY"

  schema_limitations:
    matches_csv:
      official_innings_scores_present: false
      margin_field_only: true
      reconciliation_outcome_categories: 7
      total_matches_audited: 883

  revised_overs_governance:
    unit: "LEGAL_BALLS"
    total_matches_audited: 34
    dls_revised_target_matches: 23
    target_applicability: "INNINGS_2_CHASE_ONLY"

# Task R1-02.3: Final Match-Level Classification Integrity Closure
match_state_audit_r1_02_3:
  non_exclusive_metadata_flags:
    flag_revised_target_recorded:
      count: 23
      description: "Matches with matches.csv revised_target > 0 (includes Match 17765)."
    flag_revised_overs_recorded:
      count: 34
      description: "Matches with first_inn_revised_overs or second_inn_revised_overs recorded."
    flag_dls_method_in_result_text:
      count: 19
      description: "Matches whose text result explicitly contains D/L or DLS method."
    flag_dls_target_applicable:
      count: 22
      description: "Matches with a positive revised target applicable to a concluded chase."
    flag_dls_status_unresolved:
      count: 4
      matches: [20182, 23674, 24822, 28334]
      description: "Matches with DLS in result string, but target/overs omitted from schema."
    flag_match_abandoned:
      count: 40
      description: "Matches ending in No Result or Match Abandoned (including Match 17765 and 16 zero-delivery matches)."

  mutually_exclusive_reconciliation_883:
    WICKET_WIN_NO_OFFICIAL_TOTAL_IN_SCHEMA: 394
    INCOMPLETE_EXTRAS_RUN_WIN: 382
    NO_RESULT_OR_ABANDONED: 40 # Match 17765 correctly assigned here
    OTHER_RESULT: 30
    DLS_TARGET_APPLICABLE: 22   # Concluded chases with verified target
    EXACT_BOTH_INNS_MARGIN_MISMATCH: 6
    EXACT_BOTH_INNS_MARGIN_MATCH: 5
    DLS_STATUS_UNRESOLVED: 4   # Matches 20182, 23674, 24822, 28334
    total: 883

  edge_case_classifications:
    match_17765:
      reconciliation_category: "NO_RESULT_OR_ABANDONED"
      flag_revised_target_recorded: true
      flag_revised_overs_recorded: true
      flag_match_abandoned: true
      flag_dls_target_applicable: false
      target_applicability: "DLS_ABANDONED_INCOMPLETE_CHASE"
      reason: "Abandoned as No Result after 25 deliveries in Innings 2; target not applicable to a concluded chase."
    unresolved_dls_matches:
      match_ids: [20182, 23674, 24822, 28334]
      reconciliation_category: "DLS_STATUS_UNRESOLVED"
      flag_dls_status_unresolved: true
      flag_dls_method_in_result_text: true
      flag_revised_target_recorded: false
      flag_dls_target_applicable: false
      exact_metrics_withheld: true

  downstream_score_uncertainty_contract:
    forbid_uncertain_score_run_rate_fallback: true
    exact_rrr_rule: "Exact RRR requires an exact score AND a valid target."
    lower_bound_rule: "Lower-bound scores must never be represented as exact scores."
    score_independent_features_rule: "Any proposed score-independent pressure features must be separately justified and validated in R1-03."
    zero_invented_targets_rule: "Unresolved DLS matches must never receive invented or guessed targets."



