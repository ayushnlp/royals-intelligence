# Objective: Identify the Most Reliable Players Under Pressure
# Task R1-01.1: Evidence-Backed Cricket Delivery Legality & Attribution
# ==============================================================================

paths:
  raw_data_dir: "round1_pressure/data/raw"
  processed_data_dir: "round1_pressure/data/processed"
  outputs_dir: "round1_pressure/data/outputs"
  reports_dir: "round1_pressure/reports"
  qa_summary_json: "round1_pressure/data/outputs/qa_summary.json"
  qa_report_md: "round1_pressure/reports/data_quality_report.md"
  delivery_states_strict_parquet: "round1_pressure/data/processed/delivery_states_strict.parquet"
  delivery_states_permissive_parquet: "round1_pressure/data/processed/delivery_states_permissive.parquet"
  innings_state_summary_parquet: "round1_pressure/data/processed/innings_state_summary.parquet"
  match_state_summary_parquet: "round1_pressure/data/processed/match_state_summary.parquet"
  match_result_reconciliation_parquet: "round1_pressure/data/processed/match_result_reconciliation.parquet"
  dls_and_revised_overs_audit_parquet: "round1_pressure/data/processed/dls_and_revised_overs_audit.parquet"
